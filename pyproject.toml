[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentora"
dynamic = ["version"]
description = "Autonomous web application pentest orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Pentora contributors"}]
keywords = ["pentest", "security", "owasp", "burp", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "rich>=13.7",
    "pydantic>=2.8",
    "tenacity>=9.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5.1",
]
browser = ["playwright>=1.47"]
ai = []  # LLM providers use httpx only — no extra deps needed
engine = ["py-trees>=2.2"]  # reactive-engine playbooks (behavior trees)

[project.scripts]
pentora = "pentora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pentora = [
    "templates/*.html",
    "templates/*.css",
    "templates/*.j2",
    "llm/prompts/*.txt",
    "data/*.py",
    "data/profiles/*.py",
    "data/upload_payloads/*",
    "security/*.py",
]

[tool.setuptools.dynamic]
version = {attr = "pentora.version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "A", "C4", "T20", "RET", "SIM"]
ignore = ["S101"]  # allow asserts

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "T20", "E501", "RET", "SIM", "F841"]
# Tool wrappers exist specifically to run external security tools via subprocess.
"src/pentora/wrappers/**.py" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "py_trees.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pentora.engine.playbook"
disallow_subclassing_any = false   # subclasses py_trees.Behaviour (untyped 3rd-party base)

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=pentora --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/pentora"]
omit = ["*/version.py"]
